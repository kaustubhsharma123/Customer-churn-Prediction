[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end customer churn prediction system"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level `api` package
filterwarnings = [
    # Raised inside shap's plotting module at import time (matplotlib API change); not our code.
    # Matched by message: the reported module varies with import order.
    "ignore:The set_(bad|over|under) function will be deprecated:PendingDeprecationWarning",
]
